<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STILLFEED Floating Icon</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Layout: one dark stage with the cartoon 3D floating icon (WebGL) on it, and a thin demo bar at the bottom.
   Colours come from the reference recording: dark feed ground, brown pill, soft orange count, pink brain. */
:root{
  --ground:#0c1014; --ground-2:#151c22; --ink:#eef1f2; --muted:#98a3ab; --line:#26303a; --count:#ffb15e;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--ground);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #eef1f2;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse 70% 55% at 50% 28%,#1a232b,rgba(12,16,20,0) 70%),radial-gradient(ellipse at 50% 100%,#10161b,var(--ground) 70%),var(--ground)}
.tag{position:absolute;left:20px;top:calc(18px + env(safe-area-inset-top,0px));font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:2}
.float{position:absolute;left:0;top:0;width:360px;height:220px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:60px;transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s cubic-bezier(.2,.8,.2,1)}
.float.dragging{cursor:grabbing;transition:none}
.float:focus-visible{outline:none}
.float:focus-visible::after{content:"";position:absolute;left:38px;right:38px;top:46px;bottom:54px;border-radius:999px;outline:2px solid rgba(238,241,242,.85);outline-offset:4px;pointer-events:none}
.float canvas{position:absolute;inset:0;width:360px;height:220px;display:block;pointer-events:none}
.glow{position:absolute;left:20px;right:20px;top:14px;bottom:30px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--glow,#ff9db5) 26%,transparent),rgba(0,0,0,0));filter:blur(14px);opacity:.9;transition:background 1s;pointer-events:none}
.shadow{position:absolute;left:62px;right:62px;bottom:14px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.62),rgba(0,0,0,0));filter:blur(3px);pointer-events:none;transform-origin:50% 50%}
/* flat fallback when WebGL is not available */
.fb{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.fb svg{width:300px;height:auto;overflow:visible}
.fb text{font-family:var(--font);font-weight:800;font-size:56px}

.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 16px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(12,16,20,0),rgba(12,16,20,.92) 40%);backdrop-filter:blur(2px)}
.read{min-width:150px;font-weight:600;font-variant-numeric:tabular-nums}
.read small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:min(260px,44vw);height:28px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#eef1f2;border:0;box-shadow:0 2px 10px rgba(0,0,0,.55)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#eef1f2;box-shadow:0 2px 10px rgba(0,0,0,.55)}
.btn{min-height:44px;min-width:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#121a20;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
.btn:hover{background:#1b252d}.btn:active{transform:scale(.97)}
.btn.go{background:#eef1f2;color:#0c1014;border-color:#eef1f2}.btn.go:hover{background:#fff}
@media (max-width:560px){.read{width:100%;text-align:center}.tag{left:16px}}
</style>

<main class="stage" id="stage">
  <div class="tag">STILLFEED / Floating icon</div>
  <div class="float" id="float" role="button" tabindex="0" aria-label="Reel counter">
    <i class="glow" id="glow"></i>
    <i class="shadow" id="shadow"></i>
    <canvas id="gl" width="720" height="440"></canvas>
    <div class="fb" id="fb" hidden aria-hidden="true">
      <svg viewBox="0 0 300 140"><rect x="6" y="14" width="288" height="112" rx="56" fill="#2b1400"/><rect x="10" y="10" width="280" height="112" rx="56" id="fbPill" fill="#713a00"/>
        <g id="fbBrain"><ellipse cx="86" cy="68" rx="52" ry="42" fill="#ff9db5" stroke="#5a1f3a" stroke-width="5"/><circle cx="68" cy="68" r="11" fill="#08080c"/><circle cx="104" cy="68" r="11" fill="#08080c"/><circle cx="65" cy="64" r="4" fill="#fff"/><circle cx="101" cy="64" r="4" fill="#fff"/><path d="M78 88q8 8 16 0" stroke="#4a1d2c" stroke-width="4" fill="none" stroke-linecap="round" id="fbMouth"/></g>
        <text x="214" y="86" text-anchor="middle" fill="#ffb15e" id="fbNum">7</text></svg>
    </div>
  </div>

  <section class="bar" aria-label="Demo controls">
    <div class="read" id="read">7 reels<small>Fresh</small></div>
    <div class="ctl">
      <button class="btn" id="minus" type="button" aria-label="One reel less">−</button>
      <input type="range" id="count" min="0" max="40" value="7" aria-label="Reels today">
      <button class="btn" id="plus" type="button" aria-label="One reel more">+</button>
    </div>
    <div class="ctl">
      <button class="btn go" id="play" type="button" aria-pressed="false">Play a day</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
  </section>
  <div class="sr" id="live" aria-live="polite"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   STILLFEED floating icon (cartoon 3D)
   Integration: the app only needs SkillfeedIcon.setCount(n) whenever the reel count changes,
   and optionally SkillfeedIcon.onMoodChange(fn) to react (haptics, nudges).
   Everything below the CONFIG block is rendering and can stay untouched.
   ===================================================================== */
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- config ---------- */
  const CONFIG = { allowance: 30, startCount: 7, maxCount: 99, canvas: [360, 220] };
  const MOODS = [
    { id: 'fresh', name: 'Fresh',    at: 0,    brain: '#ff9db5', pill: '#713a00', num: '#ffb15e', cover: 0,    slant: 0,    smile: 1,    open: 0.9,  tilt: 0,    squash: 1,    tear: 0, brow: 0, gaze: 0,    amp: 1,   blush: 1,   spark: 1,   zzz: 0, say: 'Your mind looks fresh.' },
    { id: 'calm',  name: 'Calm',     at: 0.25, brain: '#f69ab3', pill: '#6c3a07', num: '#fab26a', cover: 0.12, slant: 0,    smile: 0.6,  open: 0.3,  tilt: 0.02, squash: 0.98, tear: 0, brow: 0, gaze: 0,    amp: 0.9, blush: 0.9, spark: 0.3, zzz: 0, say: 'Your companion looks calm.' },
    { id: 'tired', name: 'Tired',    at: 0.5,  brain: '#e49ab0', pill: '#613a10', num: '#eeb078', cover: 0.4,  slant: 0.1,  smile: 0.05, open: 0,    tilt: 0.08, squash: 0.94, tear: 0, brow: 0, gaze: -0.5, amp: 0.7, blush: 0.6, spark: 0,   zzz: 0, say: 'Your companion looks tired.' },
    { id: 'sad',   name: 'Sad',      at: 0.75, brain: '#c79bb9', pill: '#523a20', num: '#dba886', cover: 0.5,  slant: 0.4,  smile: -0.8, open: 0.2,  tilt: 0.16, squash: 0.9,  tear: 1, brow: 1, gaze: -1,   amp: 0.5, blush: 0.25, spark: 0,  zzz: 0, say: 'Your companion looks sad.' },
    { id: 'worn',  name: 'Worn out', at: 1,    brain: '#a39ac0', pill: '#423a33', num: '#bda197', cover: 0.7,  slant: 0.55, smile: -1,   open: 0.35, tilt: 0.26, squash: 0.84, tear: 2, brow: 1, gaze: -1,   amp: 0.3, blush: 0,   spark: 0,   zzz: 1, say: 'Your companion is worn out. That is the limit for today.' }
  ];
  const tierOf = (n) => { let t = 0; MOODS.forEach((m, i) => { if (n >= Math.ceil(m.at * CONFIG.allowance - 1e-9)) t = i; }); return t; };

  /* ---------- state shared by the 3D scene and the flat fallback ---------- */
  const listeners = [];
  let count = CONFIG.startCount, tier = -1, gl = null;
  const live = $('#live');
  function announce(txt) { live.textContent = ''; setTimeout(() => { live.textContent = txt; }, 60); }
  function paintUi() {
    const m = MOODS[tier];
    $('#count').value = Math.min(count, 40);
    $('#read').innerHTML = count + (count === 1 ? ' reel' : ' reels') + '<small>' + m.name + '</small>';
    $('#float').setAttribute('aria-label', count + ' reels today. ' + m.say); $('#glow').style.setProperty('--glow', m.brain);
    $('#fbNum').textContent = count; $('#fbBrain').firstElementChild.setAttribute('fill', m.brain); $('#fbPill').setAttribute('fill', m.pill); $('#fbNum').setAttribute('fill', m.num);
    $('#fbMouth').setAttribute('d', m.smile >= 0 ? 'M78 88q8 8 16 0' : 'M78 94q8 -8 16 0');
  }
  function setCount(n) {
    const v = Math.max(0, Math.min(CONFIG.maxCount, Math.round(+n || 0)));
    if (v === count && tier >= 0) return;
    const prev = tier; count = v; tier = tierOf(count);
    paintUi();
    if (gl) gl.onCount(v, prev);
    if (prev >= 0 && tier !== prev) {
      announce(MOODS[tier].say + ' ' + count + ' reels today.');
      listeners.forEach((f) => { try { f({ mood: MOODS[tier].id, previous: MOODS[prev].id, count }); } catch (e) { /* listener error */ } });
    }
  }
  tier = tierOf(count); paintUi();

  const fl = $('#float'), stage = $('#stage');
  const [W, H] = CONFIG.canvas;
  const pos = { x: 0, y: 0 };
  let drag = null, vx = 0, vy = 0, hx = 0, hy = 0, pressed = false, tapKick = 0;
  let userMoved = false;

  /* Helper to query safe-area-inset-top in pixels across modern browsers and WebViews */
  function getSafeTop() {
    const rootPadding = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
    if (rootPadding > 0) return rootPadding;
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden;';
    document.body.appendChild(probe);
    const h = probe.offsetHeight || 0;
    probe.remove();
    return h;
  }

  /* Deliberate top-centre positioning calculations */
  const TOP_SPACING = 20;
  function getInitialTop() { return getSafeTop() + TOP_SPACING; }
  function getCenteredX() { return (stage.clientWidth - W) / 2; }

  /* ---------- dragging (works with or without WebGL) ---------- */
  function bounds() {
    const bar = $('.bar').offsetHeight;
    const safeTop = getSafeTop();
    const y0 = safeTop + 16;
    const y1 = Math.max(y0, stage.clientHeight - bar - H + 20);
    return {
      x0: -40,
      x1: stage.clientWidth - W + 40,
      y0: y0,
      y1: y1
    };
  }
  function clampPos() {
    const b = bounds();
    pos.x = Math.min(Math.max(b.x0, pos.x), Math.max(b.x0, b.x1));
    pos.y = Math.min(Math.max(b.y0, pos.y), b.y1);
  }
  function place() { fl.style.left = pos.x + 'px'; fl.style.top = pos.y + 'px'; }

  function resetToDefaultPosition() {
    userMoved = false;
    pos.x = getCenteredX();
    pos.y = getInitialTop();
    clampPos();
    place();
  }

  fl.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    try { fl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    pressed = true;
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y, moved: false, lx: e.clientX, ly: e.clientY, lt: performance.now() };
  });
  fl.addEventListener('pointermove', (e) => {
    if (drag && e.pointerId === drag.id) {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) > 5) {
        drag.moved = true;
        userMoved = true;
        fl.classList.add('dragging');
      }
      if (drag.moved) {
        pos.x = drag.ox + dx;
        pos.y = drag.oy + dy;
        clampPos();
        place();
        const now = performance.now(), dt = Math.max(8, now - drag.lt);
        vx = (e.clientX - drag.lx) / dt * 16;
        vy = (e.clientY - drag.ly) / dt * 16;
        drag.lx = e.clientX;
        drag.ly = e.clientY;
        drag.lt = now;
      }
    } else {
      const r = fl.getBoundingClientRect();
      hx = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / (r.width / 2)));
      hy = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / (r.height / 2)));
    }
  });
  fl.addEventListener('pointerleave', () => { hx = 0; hy = 0; });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const moved = drag.moved;
    drag = null;
    pressed = false;
    fl.classList.remove('dragging');
    if (moved) {
      clampPos();
      place();
    } else {
      tapKick = 1;
    }
  };
  fl.addEventListener('pointerup', endDrag);
  fl.addEventListener('pointercancel', endDrag);
  fl.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 48 : 12;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      tapKick = 1;
    } else if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      userMoved = true;
      pos.x += e.key === 'ArrowRight' ? step : e.key === 'ArrowLeft' ? -step : 0;
      pos.y += e.key === 'ArrowDown' ? step : e.key === 'ArrowUp' ? -step : 0;
      clampPos();
      place();
    }
  });

  /* Responsive resize handling: retains top-centre default across viewport changes */
  function onStageResize() {
    if (!userMoved) {
      pos.x = getCenteredX();
      pos.y = getInitialTop();
    }
    clampPos();
    place();
  }
  new ResizeObserver(onStageResize).observe(stage);
  window.addEventListener('resize', onStageResize);

  /* Initialize top-centre position */
  resetToDefaultPosition();

  /* ---------- demo bar ---------- */
  $('#count').addEventListener('input', (e) => setCount(+e.target.value));
  $('#plus').addEventListener('click', () => setCount(count + 1));
  $('#minus').addEventListener('click', () => setCount(count - 1));
  let timer = null;
  const stopPlay = () => { clearInterval(timer); timer = null; $('#play').setAttribute('aria-pressed', 'false'); $('#play').textContent = 'Play a day'; };
  $('#reset').addEventListener('click', () => { stopPlay(); setCount(0); resetToDefaultPosition(); });
  $('#play').addEventListener('click', () => {
    if (timer) { stopPlay(); return; }
    if (count >= 38) setCount(0);
    $('#play').setAttribute('aria-pressed', 'true'); $('#play').textContent = 'Pause';
    timer = setInterval(() => { setCount(count + 1); if (count >= 38) stopPlay(); }, 650);
  });

  window.SkillfeedIcon = {
    setCount,
    getCount: () => count,
    getMood: () => MOODS[tier].id,
    onMoodChange: (fn) => { listeners.push(fn); },
    moveTo: (x, y) => { userMoved = true; pos.x = x; pos.y = y; clampPos(); place(); },
    resetPosition: resetToDefaultPosition,
    get isMoved() { return userMoved; },
    get position() { return { x: pos.x, y: pos.y }; },
    get renderer() { return gl ? 'webgl' : 'fallback'; }
  };
  window.StillfeedIcon = window.SkillfeedIcon;

  /* ===================================================================
     3D scene
     =================================================================== */
  const THREE = window.THREE;
  const canvas = $('#gl');
  let renderer = null;
  if (THREE) { try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); } catch (e) { renderer = null; } }
  if (!renderer) { canvas.hidden = true; $('#fb').hidden = false; $('#shadow').hidden = true; $('#glow').hidden = true; return; }

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 50); camera.position.set(0, 0.05, 7.4);

  // soft studio reflections (only used by the glossy eyes)
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.background = new THREE.Color(0x2a2018);
  [[8, 3, -3, 5, 4, 3, 0xffffff], [4, 4, 5, 1, 3, 1.6, 0xffd9b0], [10, 2, 0, -5, 2, 0.6, 0xaa7755]].forEach(([w, h, x, y, z, k, c]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m);
  });
  scene.environment = pm.fromScene(envScene, 0.04).texture;
  scene.add(new THREE.AmbientLight(0xffffff, 0.34));
  const key = new THREE.DirectionalLight(0xffffff, 0.46); key.position.set(-2, 3, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd0a8, 0.18); rim.position.set(4, 1, -3); scene.add(rim);

  const root = new THREE.Group(); scene.add(root);

  /* ---------- cartoon materials ---------- */
  const ramp = (() => { const d = new Uint8Array([120, 175, 225, 255]); const t = new THREE.DataTexture(d, 4, 1, THREE.LuminanceFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
  const toon = (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: ramp });
  const outlineColor = new THREE.Color('#5a1f3a');
  const outlineMat = new THREE.ShaderMaterial({
    uniforms: { uT: { value: 0.05 }, uC: { value: outlineColor } }, side: THREE.BackSide,
    vertexShader: 'uniform float uT; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * uT, 1.0); }',
    fragmentShader: 'uniform vec3 uC; void main(){ gl_FragColor = vec4(uC, 1.0); }'
  });

  /* ---------- pill ---------- */
  const PW = 4.4, PH = 1.9, BEV = 0.12, DEPTH = 0.42, BT = 0.14;
  const stadium = (w, h) => {
    const r = h / 2, s = new THREE.Shape();
    s.moveTo(0, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.absarc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2, false);
    s.lineTo(-w / 2 + r, h / 2); s.absarc(-w / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5, false); s.lineTo(0, -h / 2); return s;
  };
  const FRONT = DEPTH / 2 + BT;
  const pillSideMat = toon('#713a00');
  const pillGeo = new THREE.ExtrudeGeometry(stadium(PW - 2 * BEV, PH - 2 * BEV), { depth: DEPTH, bevelEnabled: true, bevelThickness: BT, bevelSize: BEV, bevelSegments: 7, curveSegments: 56 });
  pillGeo.translate(0, 0, -DEPTH / 2);
  root.add(new THREE.Mesh(pillGeo, pillSideMat));
  // thick cartoon outline: a slightly larger, darker stadium behind
  const pillOutMat = new THREE.MeshBasicMaterial({ color: '#2b1400' });
  const pillOut = new THREE.Mesh(new THREE.ExtrudeGeometry(stadium(PW + 0.1, PH + 0.1), { depth: DEPTH, bevelEnabled: true, bevelThickness: BT, bevelSize: BEV, bevelSegments: 7, curveSegments: 56 }), pillOutMat);
  pillOut.position.z = -DEPTH / 2 - 0.07; root.add(pillOut);
  // front face with a top-to-bottom shade
  const frontGeo = new THREE.ShapeGeometry(stadium(PW - 0.02, PH - 0.02), 48);
  { const p = frontGeo.attributes.position, c = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) { const t = (p.getY(i) / PH + 0.5), sh = Math.max(0, 1 - Math.hypot((p.getX(i) + 1.3) / 2.4, (p.getY(i) - 0.55) / 1.15)), v = 0.78 + 0.26 * t + 0.3 * sh * sh; c[i * 3] = c[i * 3 + 1] = c[i * 3 + 2] = v; }
    frontGeo.setAttribute('color', new THREE.BufferAttribute(c, 3)); }
  const pillFrontMat = new THREE.MeshBasicMaterial({ color: '#713a00', vertexColors: true });
  const pillFront = new THREE.Mesh(frontGeo, pillFrontMat); pillFront.position.z = FRONT + 0.002; root.add(pillFront);

  /* ---------- brain ---------- */
  const brainToon = toon('#ff9db5'), foldMat = toon('#e8708f'), lidToon = toon('#ff9db5');
  const brainG = new THREE.Group(); brainG.position.set(-1.2, 0.02, FRONT + 0.03); brainG.scale.setScalar(0.62); root.add(brainG);
  const body = new THREE.Group(); brainG.add(body);
  const sphere = new THREE.SphereGeometry(1, 40, 30);
  const RX = 0.76, RY = 0.82, RZ = 0.74, CX = 0.3, CY = 0.02;
  const surfZ = (x, y, cx) => RZ * Math.sqrt(Math.max(0, 1 - ((x - cx) / RX) ** 2 - ((y - CY) / RY) ** 2));
  const part = (cx, cy, cz, sx, sy, sz, thick) => {
    const g = new THREE.Group(); g.position.set(cx, cy, cz); g.scale.set(sx, sy, sz);
    const m = new THREE.Mesh(sphere, brainToon); g.add(m);
